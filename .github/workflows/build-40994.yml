name: 构建 SukiSU-40994 内核

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android14"
      kernel_version: "6.1"
      sub_level: "138"
      os_patch_level: "2025-06"
      ksu_variant: "SukiSU"
      ksu_commit: "dfae923781350cb5113e0763a17e90cc4edd59b4"
      use_zram: true
      use_bbg: true
      use_net_enhance: true
      use_rekernel: true
